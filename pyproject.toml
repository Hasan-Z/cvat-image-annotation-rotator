[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-dataset-rotation-tool"
version = "0.1.0"
description = "Rotate CVAT datasets and update annotations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hasan Zemzem", email = "hasan.zamzam@gmail.com"},
]
keywords = ["cvat", "annotations", "computer-vision", "datasets", "image-rotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "shapely>=2.0",
    "lxml>=5.2",
    "pycocotools>=2.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = {find = {}}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
